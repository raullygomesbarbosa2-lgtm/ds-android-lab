name: Core JVM tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure standalone Kotlin/JVM test project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { gradlePluginPortal(); mavenCentral() } }
          rootProject.name = 'ds-core-jvm-tests'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'org.jetbrains.kotlin.jvm' version '2.0.21' }
          repositories { mavenCentral() }
          dependencies {
            testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.0.21'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
          }
          sourceSets {
            main.kotlin.srcDirs = ['core/src/main/kotlin']
            test.kotlin.srcDirs = ['core/src/test/kotlin']
          }
          test { useJUnitPlatform() }
          EOF
      - name: Compile core and run unit tests
        run: gradle --no-daemon clean test
