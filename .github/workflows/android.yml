name: Android ROM banner icon build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android ROM banner icon viewer APK
        run: |
          mkdir -p app/src/main/java/lab/ds/app app/src/main
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'DSAndroidLab'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'lab.ds.app'; compileSdk 35
            defaultConfig { applicationId 'lab.ds.app'; minSdk 24; targetSdk 28; versionCode 5; versionName '0.5-rom-banner-icon-fix' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="DS Android Lab"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/lab/ds/app/MainActivity.java <<'EOF'
          package lab.ds.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.view.Gravity;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ImageView;
          import java.io.InputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          public class MainActivity extends Activity {
            private static final int PICK_ROM=42; private TextView status; private ImageView romIcon;
            @Override public void onCreate(Bundle b) { super.onCreate(b);
              LinearLayout box=new LinearLayout(this); box.setOrientation(1); box.setGravity(Gravity.CENTER); box.setPadding(20,20,20,20); box.setBackgroundColor(Color.rgb(20,28,40));
              TextView title=new TextView(this); title.setText("DS Android Lab — ROM banner icon"); title.setTextColor(Color.WHITE); title.setTextSize(22); title.setGravity(Gravity.CENTER); box.addView(title);
              romIcon=new ImageView(this); romIcon.setAdjustViewBounds(true); romIcon.setScaleType(ImageView.ScaleType.FIT_CENTER); box.addView(romIcon,new LinearLayout.LayoutParams(160,160));
              TextView notice=new TextView(this); notice.setTextColor(Color.YELLOW); notice.setGravity(Gravity.CENTER); notice.setText("Mostra somente o ícone 32×32 embutido no banner da ROM. NÃO executa o jogo nem mostra gráficos da partida."); box.addView(notice);
              Button choose=new Button(this); choose.setText("Selecionar ROM .nds"); choose.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType("*/*");startActivityForResult(i,PICK_ROM);}); box.addView(choose);
              status=new TextView(this); status.setTextColor(Color.WHITE); status.setTextSize(14); status.setGravity(Gravity.CENTER); status.setText("Selecione uma ROM .nds para tentar ler seu ícone embutido."); box.addView(status); setContentView(box);
            }
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){super.onActivityResult(requestCode,resultCode,data); if(requestCode!=PICK_ROM||resultCode!=RESULT_OK||data==null||data.getData()==null)return; romIcon.setImageDrawable(null); java.io.File copy=null; try{copy=java.io.File.createTempFile("nds-rom-", ".tmp", getCacheDir()); long length=copyRomToCache(data.getData(),copy); if(length<0x160)throw new Exception("ROM curta demais."); try(java.io.RandomAccessFile f=new java.io.RandomAccessFile(copy,"r")){byte[] h=new byte[0x160];f.readFully(h);ByteBuffer b=ByteBuffer.wrap(h).order(ByteOrder.LITTLE_ENDIAN);String name=new String(h,0,12,StandardCharsets.US_ASCII).replace("\u0000","").trim();String game=new String(h,12,4,StandardCharsets.US_ASCII);long a9=u32(b,0x20),s9=u32(b,0x2c),a7=u32(b,0x30),s7=u32(b,0x3c),banner=u32(b,0x68);if(!game.matches("[A-Z0-9]{4}")||!inside(a9,s9,length)||!inside(a7,s7,length)||s9==0||s7==0)throw new Exception("Cabeçalho NDS inválido.");if(banner==0){status.setText("ROM reconhecida: "+name+" ("+game+"), mas não há banner/ícone (offset zero). Jogo não executado.");return;}if(banner<0x160||!inside(banner,0x240,length)){status.setText("ROM reconhecida: "+name+" ("+game+"), mas o banner/ícone está fora dos limites ou incompleto. Jogo não executado.");return;}f.seek(banner);byte[] payload=new byte[0x240];f.readFully(payload);Bitmap icon=decodeIcon(payload);romIcon.setImageBitmap(icon);status.setText("Ícone embutido na ROM: "+name+" ("+game+"). Exibe a arte do banner; o jogo NÃO é executado e os gráficos da partida não são mostrados.");}}catch(Exception e){status.setText("Falha ao ler ícone da ROM: "+(e.getMessage()==null?"arquivo inválido":e.getMessage())+". O jogo não foi executado.");}finally{if(copy!=null)copy.delete();}}
            private long copyRomToCache(android.net.Uri uri,java.io.File target)throws java.io.IOException{long total=0;try(InputStream in=getContentResolver().openInputStream(uri);java.io.OutputStream out=new java.io.BufferedOutputStream(new java.io.FileOutputStream(target))){if(in==null)throw new java.io.IOException("Não foi possível abrir o arquivo selecionado.");byte[] buf=new byte[65536];int n;while((n=in.read(buf))!=-1){total+=n;if(total>536870912L)throw new java.io.IOException("ROM maior que o limite suportado de 512 MiB.");out.write(buf,0,n);}}return total;}
            private static Bitmap decodeIcon(byte[] banner){int[] colors=new int[16];for(int i=0;i<16;i++){int v=(banner[0x220+i*2]&255)|((banner[0x221+i*2]&255)<<8);int r=v&31,g=(v>>>5)&31,b=(v>>>10)&31;int rr=(r<<3)|(r>>>2),gg=(g<<3)|(g>>>2),bb=(b<<3)|(b>>>2);colors[i]=i==0?Color.TRANSPARENT:Color.rgb(rr,gg,bb);}int[] pixels=new int[32*32];int data=0x20;for(int ty=0;ty<4;ty++)for(int tx=0;tx<4;tx++)for(int y=0;y<8;y++)for(int x=0;x<8;x++){int index=banner[data++]&255;int px=tx*8+x,py=ty*8+y;pixels[py*32+px]=colors[index&15];pixels[py*32+px+1]=colors[(index>>>4)&15];x++;}return Bitmap.createBitmap(pixels,32,32,Bitmap.Config.ARGB_8888);}
            private static long u32(ByteBuffer b,int p){return Integer.toUnsignedLong(b.getInt(p));} private static boolean inside(long o,long s,long l){return o>=0&&s>=0&&o<=l&&s<=l-o;}
          }
          EOF
          gradle wrapper --gradle-version 8.7
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ds-android-lab-rom-banner-icon-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish ROM banner icon viewer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.5-rom-banner-icon-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "DS Android Lab — ROM banner icon viewer fix (run ${GITHUB_RUN_NUMBER})" --notes "Fixes SAF providers that report unknown file length by copying the selected ROM to a bounded cache file and validating against its actual byte count. Displays the actual 32x32 icon embedded in a Nintendo DS ROM banner when present. It does not execute/emulate the game and does not show gameplay graphics. No BIOS, firmware, emulator core, or game files are included."
